apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailfrom-milter
  labels:
    app: mailfrom-milter
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mailfrom-milter
  template:
    metadata:
      labels:
        app: mailfrom-milter
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mailfrom-milter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: milter
              containerPort: {{ .Values.milterPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.milterPort }}"
            - name: METRICS_ADDR
              value: "0.0.0.0:{{ .Values.metricsPort }}"
            - name: MILTER_READ_TIMEOUT_SECONDS
              value: {{ .Values.milterReadTimeoutSeconds | quote }}
            - name: MILTER_WRITE_TIMEOUT_SECONDS
              value: {{ .Values.milterWriteTimeoutSeconds | quote }}
            - name: MF_ACTION
              value: "{{ .Values.MF_ACTION }}"
            - name: REJECT_CODE
              value: "{{ .Values.REJECT_CODE }}"
            - name: MF_SENDER_ADD
              value: "{{ .Values.MF_SENDER_ADD }}"
            {{- with .Values.sender.dsnSecret.name }}
            - name: SENDER_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.sender.dsnSecret.key | quote }}
            - name: SENDER_QUERY
              value: {{ $.Values.sender.query | quote }}
            - name: SENDER_CACHE_SIZE
              value: {{ $.Values.sender.cacheSize | quote }}
            - name: SENDER_CACHE_TTL_SECONDS
              value: {{ $.Values.sender.cacheTTLSeconds | quote }}
            - name: SENDER_CACHE_MISS_TTL_SECONDS
              value: {{ $.Values.sender.cacheMissTTLSeconds | quote }}
            - name: SENDER_DB_TIMEOUT_SECONDS
              value: {{ $.Values.sender.dbTimeoutSeconds | quote }}
            {{- end }}
            {{- if .Values.logLevel }}
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
