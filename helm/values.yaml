image:
  repository: ghcr.io/yarilomail/mailfrom-milter
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []

replicaCount: 1

# Milter listen port inside the container
milterPort: 10031

# A milter connection silent this long is closed. Postfix keeps one
# connection for a whole SMTP session and says nothing while the client
# sends, so this outlasts any session; it frees connections nobody uses.
milterReadTimeoutSeconds: 3600
# A reply Postfix does not take within this closes the connection.
milterWriteTimeoutSeconds: 60

# Observability port — /healthz, /readyz, /metrics
metricsPort: 8081

# Action on envelope-from / From-header domain mismatch.
# Values: reject | discard | quarantine_header | accept
MF_ACTION: reject

# SMTP reply code for reject action: 421 (temporary) or 550 (permanent)
REJECT_CODE: "421"

# Set to "yes" to add X-MF-Envelope-From header on accepted authenticated
# messages (reject and discard actions only)
MF_SENDER_ADD: "no"

# Which login may send as which address. With dsnSecret.name set, check A
# asks the alias table: a login may send as itself or as an address whose
# active row names it in goto. Empty keeps the domain comparison.
sender:
  dsnSecret:
    # Secret holding a go-sql-driver DSN, e.g. user:pass@tcp(mysql:3306)/db
    name: ""
    key: dsn
  query: "SELECT goto FROM alias WHERE address = ? AND active = 1"
  cacheSize: 10000
  cacheTTLSeconds: 60
  cacheMissTTLSeconds: 10
  # A lookup over this tempfails the message.
  dbTimeoutSeconds: 2

# Set to "debug" to enable verbose per-message logging
logLevel: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

# Post-deployment smoke test (Helm post-install/post-upgrade hook Job).
# The Job skips automatically if the credentials secret is absent.
#
# Create the secret once (outside Helm):
#   kubectl create secret generic mailfrom-test-creds \
#     --from-literal=password='<smtp-password>' -n <namespace>
postDeployTest:
  enabled: false
  credentialsSecret: "mailfrom-test-creds"  # all params loaded from this secret
