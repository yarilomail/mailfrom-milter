image:
  repository: ghcr.io/yarilomail/mailfrom-milter
  tag: "581c42e"
  pullPolicy: Always

# The image is public; the stand namespace has no pull secret.
imagePullSecrets: []

replicaCount: 1

milterPort: 10031
metricsPort: 8081

# reject | discard | quarantine_header | accept
MF_ACTION: reject
REJECT_CODE: "421"
MF_SENDER_ADD: "yes"

logLevel: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

# No credentials Secret on the stand; the relay's sender checks cover it.
postDeployTest:
  enabled: false
  credentialsSecret: "relay-mailfrom-creds"
